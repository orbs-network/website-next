version: 2

updates:
  # The app itself. Weekly, grouped so a routine patch sweep is one PR rather
  # than twenty.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Majors of the TEST AND STORY TOOLING only.
    #
    # Dependabot opened five major PRs within minutes of this config landing —
    # tailwindcss 3->4, typescript 5->7, eslint 9->10, vite 7->8,
    # cf-content-types-generator 2->3 — none backed by an advisory. Those are
    # migrations, not upgrades: Tailwind 4 is a new config format and engine.
    # They belong in deliberate work with the test suite to check against, not
    # sitting open looking actionable, which is how a list stops being read.
    #
    # Scoped by name rather than `dependency-name: '*'` ON PURPOSE. GitHub
    # applies `ignore` to security updates as well as version updates, so a
    # wildcard would suppress the only automated fix for any advisory that is
    # remediated in a major — precisely the case where you most want the PR.
    # Naming the packages keeps next, react, contentful and everything else
    # that ships on the default path.
    ignore:
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'cf-content-types-generator'
        update-types: ['version-update:semver-major']
      - dependency-name: 'storybook'
        update-types: ['version-update:semver-major']
      - dependency-name: '@storybook/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
    groups:
      # Test and story tooling never reaches the runtime bundle, so these can
      # land together without per-package scrutiny.
      dev-tooling:
        patterns:
          - '@storybook/*'
          - 'storybook'
          - '@chromatic-com/*'
          - 'eslint-plugin-storybook'
          - 'vitest'
          - '@vitest/*'
          - 'vite'
          - 'playwright'
        update-types:
          - minor
          - patch
      # Anything that ships. Kept separate so it gets read properly.
      runtime:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - 'contentful'
          - '@contentful/*'
          - 'sharp'
        update-types:
          - minor
          - patch

# scripts/orbs-website-migration is deliberately absent from `updates`.
#
# That directory is a one-off local tool for moving the legacy blog into
# Contentful. It never deploys, never runs in CI, and is deleted once the
# migration completes (see docs/migration-plan.md, Phase 1). There is no value
# in Dependabot opening upgrade PRs against it.
#
# NB — this does NOT silence its security alerts, and it is worth being precise
# about why. Dependabot has two independent features:
#
#   * alerts  — built from the repo's dependency graph, which indexes EVERY
#               manifest and lockfile. Not configurable from this file.
#   * updates — the PRs, configured here.
#
# So the 44 alerts that directory contributes will persist until either its
# package-lock.json stops being committed or the directory is removed at
# cutover. Removing the lockfile would cost reproducibility on a script that
# writes to production Contentful, so it stays for now.
