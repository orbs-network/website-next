name: CI

on:
  pull_request:
  push:
    branches: [main]

# Fork PRs run tests without repository write access or application secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Matches the Vercel project's runtime (24.x). Testing on a
          # different major than production ships on is a gap — and several
          # dev dependencies now declare "node": ">=22", so Node 20 would warn
          # here and fail outright under engine-strict.
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Formatting is checked, not assumed. It had drifted to 35 files with
      # nothing failing, so a `prettier --write` during unrelated work swept
      # 30 of them into a PR and buried the actual change. Same principle as
      # the link-integrity and redirect guards: fail CI rather than ask people
      # to remember.
      - run: npm run format:check
      - run: npm run lint
      # Generate route types and next-env.d.ts on a clean checkout, without
      # prerendering Contentful pages or requiring production credentials.
      - run: npx next typegen && npx tsc --noEmit
      - run: npm test
