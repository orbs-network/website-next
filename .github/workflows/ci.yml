name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Vercel project's runtime (24.x). Testing on a
          # different major than production ships on is a gap — and several
          # dev dependencies now declare "node": ">=22", so Node 20 would warn
          # here and fail outright under engine-strict.
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
